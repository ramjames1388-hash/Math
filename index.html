<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>استاد محمد امین کریمی</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lalezar&family=Vazirmatn:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eaf4ff;--grid:#cfe4fb;--card:#fff;--ink:#0e2a4d;--mut:#5d7899;--line:#d3e5fa;--p:#2d7be0;--p2:#4fb0ff;--pen:#ffc933;--mar:rgba(255,120,150,.45);
--ok-bg:#d9f7e4;--ok:#14663a;--warn-bg:#fff0c2;--warn:#8a5a00;--bad-bg:#ffe1e1;--bad:#a12626;--org-bg:#ffe6cf;--org:#9a4a12;--sh:0 6px 22px rgba(45,123,224,.12);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1a33;--grid:#12305a;--card:#0f2547;--ink:#eaf4ff;--mut:#8fb0d6;--line:#1c3b68;--p:#5aa9ff;--p2:#7cc4ff;--mar:rgba(255,120,150,.3);
--ok-bg:#12452c;--ok:#bdf5d3;--warn-bg:#5c4208;--warn:#ffe29a;--bad-bg:#5e1d1d;--bad:#ffc9c9;--org-bg:#5a3012;--org:#ffd7b3;--sh:0 6px 22px rgba(0,0,0,.3)}}
:root[data-theme="dark"]{--bg:#0a1a33;--grid:#12305a;--card:#0f2547;--ink:#eaf4ff;--mut:#8fb0d6;--line:#1c3b68;--p:#5aa9ff;--p2:#7cc4ff;--mar:rgba(255,120,150,.3);
--ok-bg:#12452c;--ok:#bdf5d3;--warn-bg:#5c4208;--warn:#ffe29a;--bad-bg:#5e1d1d;--bad:#ffc9c9;--org-bg:#5a3012;--org:#ffd7b3;--sh:0 6px 22px rgba(0,0,0,.3)}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;color:var(--ink);font-family:Vazirmatn,Tahoma,sans-serif;line-height:1.8;min-height:100vh;background-color:var(--bg);
background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px}
body:before{content:"";position:fixed;top:0;bottom:0;right:18px;width:2px;background:var(--mar);pointer-events:none}
.wrap{max-width:520px;margin:0 auto;padding:14px 18px 28px;position:relative}
button{font:inherit;cursor:pointer}
.top{display:flex;align-items:center;gap:10px;margin-bottom:12px}.top>div:nth-child(2){flex:1}
.top b{display:block;font-weight:800;font-size:16px;line-height:1.3}.top small{color:var(--mut);font-size:11.5px}
.lg{width:42px;height:42px;border-radius:13px;background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;display:grid;place-items:center;font-family:Lalezar;font-size:24px;box-shadow:var(--sh)}
.ic{width:42px;height:42px;border-radius:13px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:17px;padding:0}
.tabs{display:flex;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:4px;margin-bottom:14px;box-shadow:var(--sh)}
.tabs button{flex:1;border:0;background:transparent;color:var(--mut);padding:9px;font-weight:500;border-radius:12px;font-size:14px;transition:.2s}
.tabs button.on{background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;font-weight:700}
.hero{border-radius:26px;padding:22px 20px 0;color:#fff;position:relative;overflow:hidden;background:linear-gradient(160deg,#1b5fc0,#3d95f0 58%,#72c4ff);box-shadow:0 12px 30px rgba(45,123,224,.3)}
.hero:before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.13) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.13) 1px,transparent 1px);background-size:22px 22px}
.hero>*{position:relative}.hero svg.cv{position:absolute;left:0;bottom:0;width:100%;height:150px;opacity:.35;pointer-events:none}
.sy{position:absolute;font-family:Lalezar;color:#fff;opacity:.2;font-size:34px;pointer-events:none;animation:fl 6s ease-in-out infinite alternate}
@keyframes fl{to{transform:translateY(-8px) rotate(6deg)}}
.hero h1{font-family:Lalezar,Vazirmatn,sans-serif;font-weight:400;font-size:38px;line-height:1.2;margin:0;text-shadow:0 3px 0 rgba(14,42,77,.25)}
.hero p{margin:0;opacity:.9;font-size:13px}
.chips{display:flex;gap:6px;margin-top:12px;overflow-x:auto}
.chips button{border:1px solid rgba(255,255,255,.55);background:transparent;color:#fff;border-radius:99px;padding:2px 14px;font-size:12.5px;white-space:nowrap}
.chips button.on{background:#fff;color:#1b5fc0;font-weight:700}
.pod{display:flex;align-items:flex-end;gap:6px;margin-top:22px}.col{flex:1;min-width:0;text-align:center}
.nm{display:flex;flex-direction:column;gap:6px;margin-bottom:8px}
.p{background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.4);border-radius:14px;padding:8px 4px;backdrop-filter:blur(4px)}
.av{width:36px;height:36px;border-radius:50%;margin:0 auto 3px;display:grid;place-items:center;font-weight:800;font-size:15px;color:#fff;border:2px solid var(--g,#fff)}
.p b{display:block;font-size:12.5px;line-height:1.5}.p small{display:block;font-size:10.5px;opacity:.85;line-height:1.4;min-height:15px}
.p em{font-style:normal;font-weight:800;color:var(--g);font-size:13.5px;direction:ltr;display:block;text-shadow:0 1px 0 rgba(0,0,0,.15)}
.base{border-radius:12px 12px 0 0;display:grid;place-items:center;font-family:Lalezar;font-size:30px;color:#14305a}
.k1{--g:#ffd45c}.k1 .base{background:linear-gradient(#ffd45c,#e0a512)}.k2{--g:#e4ecf8}.k2 .base{background:linear-gradient(#e4ecf8,#a9b9d1)}.k3{--g:#f6b07a}.k3 .base{background:linear-gradient(#f6b07a,#c46f35)}
.stats{display:flex;gap:8px;margin-top:12px}.stats div{flex:1;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:8px 6px;text-align:center;box-shadow:var(--sh)}
.stats b{display:block;font-family:Lalezar;font-size:24px;line-height:1.3;color:var(--p);direction:ltr}.stats span{font-size:11.5px;color:var(--mut)}
.more,.card{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--sh)}
.more{padding:8px 14px;margin-top:12px}.more h3{margin:6px 0}
.more .r{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.more .r i{font-style:normal;width:26px;height:26px;border-radius:50%;background:var(--p);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700}
.more .r span{flex:1}.more .r b{direction:ltr;color:var(--p)}
.card{padding:18px;margin-top:12px;animation:up .45s both}
@keyframes up{from{opacity:0;transform:translateY(10px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
h3{margin:0 0 8px;font-size:14.5px;font-weight:800}h3 i{font-style:normal;font-family:Lalezar;color:var(--p);margin-left:6px;font-size:18px}
label{display:block;font-size:13px;color:var(--mut);margin:0 0 4px}
.f{position:relative}.f input[type=text],.f input[type=password]{width:100%;padding:13px 14px;font:inherit;font-size:16px;border:1.5px solid var(--line);border-radius:14px;background:var(--bg);color:var(--ink);margin-bottom:14px;direction:ltr;text-align:left;outline:none}
.f input:focus{border-color:var(--p2)}.f .ey{position:absolute;left:8px;top:7px;border:0;background:none;font-size:18px;color:var(--mut)}
.go{width:100%;padding:14px;border:0;border-radius:14px;font-weight:800;font-size:15px;color:#fff;background:linear-gradient(135deg,var(--p),var(--p2))}
.go:disabled{opacity:.6}.rm{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mut);margin:-2px 0 14px}
.err{color:var(--bad);background:var(--bad-bg);border-radius:12px;padding:8px 12px;font-size:13px;margin-bottom:12px;display:none}
.me{display:flex;align-items:center;gap:14px;margin-top:0;background:linear-gradient(160deg,#1b5fc0,#3d95f0);color:#fff;border:0}
.me .av{width:54px;height:54px;font-size:22px;margin:0;border-color:var(--pen)}.me small{opacity:.85;font-size:12.5px}.me b{display:block;font-size:18px;font-weight:800;line-height:1.4}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}.g2 .card{margin:0;padding:14px;text-align:center}
.st{width:34px;height:34px;border-radius:50%;margin:0 auto 6px;display:grid;place-items:center;font-weight:800}
.g2 small{color:var(--mut);font-size:12px;display:block}.g2 b{font-size:14.5px}
.sent,.full{background:var(--ok-bg);color:var(--ok)}.late{background:var(--warn-bg);color:var(--warn)}.partial{background:var(--org-bg);color:var(--org)}.no,.none{background:var(--bad-bg);color:var(--bad)}
.res{display:flex;align-items:center;gap:16px}.ring{position:relative;width:104px;height:104px;flex:none}.ring svg{transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:Lalezar;font-size:26px;direction:ltr}
.res small{color:var(--mut);display:block;font-size:12.5px}.res .v{font-weight:800;font-size:15px}
.chip{display:inline-block;border-radius:99px;padding:0 10px;font-size:12px;font-weight:700;margin-top:4px}
.bars{display:flex;gap:10px;margin-top:16px;overflow-x:auto;padding-bottom:4px}
.bc{flex:0 0 56px;text-align:center}.bw{position:relative;height:96px;display:flex;align-items:flex-end;justify-content:center}
.bw i{display:block;width:30px;border-radius:8px 8px 3px 3px;background:linear-gradient(var(--p2),var(--p));min-height:4px}
.bw u{position:absolute;left:0;right:0;border-top:2px dashed var(--pen);text-decoration:none}
.bc b{font-size:11.5px;direction:ltr;display:block}.bc span{font-size:10.5px;color:var(--mut);line-height:1.3;display:block}
.lgd{font-size:11.5px;color:var(--mut);margin-top:6px}.lgd u{display:inline-block;width:18px;border-top:2px dashed var(--pen);vertical-align:middle;margin-left:4px}
.ab{display:flex;align-items:center;justify-content:space-between}.ab .n{font-family:Lalezar;font-size:40px;line-height:1;color:var(--p)}
.note{background:var(--bg);border-radius:14px;padding:12px 14px;font-size:13.5px}.tag{display:inline-block;background:var(--line);border-radius:99px;padding:0 10px;font-size:12px;margin-bottom:4px}
.out{width:100%;margin-top:12px;padding:12px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--mut)}
.foot{text-align:center;color:var(--mut);font-size:12px;margin-top:18px}
.ico{width:1.15em;height:1.15em;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.2em;flex:none}
.lg{padding:0;overflow:hidden}.lg svg{width:100%;height:100%}.top b.wm{font-family:Lalezar,Vazirmatn,sans-serif;font-weight:400;font-size:21px;line-height:1.25}
.tabs button{display:flex;align-items:center;justify-content:center;gap:6px}.tabs .ico{width:17px;height:17px}.ic .ico{width:20px;height:20px}
h3 i svg{width:19px;height:19px;vertical-align:-4px}.f .ey .ico{width:20px;height:20px}
.empty{text-align:center;padding:14px 6px;color:var(--mut)}.empty b{display:block;color:var(--ink);margin-top:8px;font-size:15px}.empty small{display:block;font-size:12.5px}
.kr{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:14px;margin-top:8px;color:var(--ink);text-decoration:none;font-weight:500}.kr .ico{color:var(--p)}
.tr{margin-top:14px;border-top:1px dashed var(--line);padding-top:12px}.tr svg{width:100%;height:auto;display:block;margin-top:6px}
.med{width:16px;height:16px;vertical-align:-3px}.chip .ico{width:14px;height:14px}.me small .ico{width:15px;height:15px}
.wrap{padding-bottom:calc(104px + env(safe-area-inset-bottom,0px))}
.tabs{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:520px;z-index:20;border-radius:24px 24px 0 0;border:1px solid var(--line);border-bottom:0;background:var(--card);box-shadow:0 -8px 28px rgba(14,42,77,.14);padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));gap:4px;position:fixed}
.tabs button{position:relative;z-index:1;flex-direction:column;gap:2px;padding:7px 4px 5px;font-size:11.5px;font-weight:500;background:transparent;color:var(--mut);border-radius:16px;transition:color .25s}
.tabs button.on{background:transparent;color:var(--p);font-weight:700}
.tabs button .ico{width:23px;height:23px;transition:transform .3s cubic-bezier(.3,1.5,.5,1)}.tabs button.on .ico{transform:translateY(-2px) scale(1.12)}
.tabs button:active .ico{transform:scale(.88)}
.ind{position:absolute;top:8px;height:calc(100% - 16px - env(safe-area-inset-bottom,0px));border-radius:16px;background:rgba(45,123,224,.13);transition:left .35s cubic-bezier(.4,0,.2,1),width .35s cubic-bezier(.4,0,.2,1);z-index:0}
.view:not([hidden]){animation:vin .38s cubic-bezier(.2,.8,.2,1) both}
@keyframes vin{from{opacity:0;transform:translateY(14px)}}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
 <div class="top"><div class="lg" id="lg"></div><div><small>استاد</small><b class="wm">محمد امین کریمی</b></div><button class="ic" id="th" aria-label="تغییر تم"></button></div>
 <div id="pub" class="view"></div>
 <div id="key" class="view" hidden></div>
 <div id="priv" class="view" hidden>
  <form id="login" class="card" autocomplete="off" style="margin-top:0">
   <h3><i data-ic="user"></i>ورود به پنل شخصی</h3><div class="err" id="err"></div>
   <label for="u">نام کاربری</label><div class="f"><input id="u" type="text" autocapitalize="none" autocomplete="username" required></div>
   <label for="p">رمز عبور</label><div class="f"><input id="p" type="password" autocomplete="current-password" required><button type="button" class="ey" id="ey" aria-label="نمایش رمز"></button></div>
   <label class="rm"><input type="checkbox" id="rm" checked> نام کاربری را به خاطر بسپار</label>
   <button class="go" id="go">ورود</button>
  </form>
  <div id="dash" hidden></div>
 </div>
 <div class="foot">© استاد محمد امین کریمی · آخرین بروزرسانی: ۱۰ مهر ۱۴۰۵</div>
</div>
<nav class="tabs" id="nav" aria-label="ناوبری اصلی"><i class="ind" id="ind"></i><button id="tp" class="on"><span data-ic="trophy"></span>نفرات برتر</button><button id="tk"><span data-ic="grid"></span>پاسخنامه</button><button id="tl"><span data-ic="user"></span>پنل من</button></nav>

const SYM='<span class="sy" style="top:10px;left:14px">π</span><span class="sy" style="top:64px;left:46%;animation-delay:-2s">∑</span><span class="sy" style="top:8px;left:36%;font-size:26px;animation-delay:-4s">√</span><span class="sy" style="top:96px;left:12px;font-size:28px;animation-delay:-1s">x²</span><span class="sy" style="top:70px;right:12px;animation-delay:-3s">∞</span>';
const CURVE='<svg class="cv" viewBox="0 0 400 150" preserveAspectRatio="none"><path d="M0 140 Q100 -40 200 80 T400 20" fill="none" stroke="#fff" stroke-width="2.5"/><path d="M0 148H400" stroke="#fff" stroke-width="1.5"/></svg>';
let cur=TOP.length-1;
function pub(){
  const e=TOP[cur];if(!e){$("pub").innerHTML="";return}
  const by={};e.rows.forEach(r=>(by[r[2]]=by[r[2]]||[]).push(r));
  const ps=Object.keys(by).map(Number).sort((a,b)=>b-a);
  const card=r=>`<div class="p">${av(r[0])}<b>${r[0]}</b><small>${r[1]}</small><em>${fa(r[2])}%</em></div>`;
  const grp=k=>ps[k-1]==null?"":`<div class="col k${k}"><div class="nm">${by[ps[k-1]].map(card).join("")}</div><div class="base" style="height:${[0,92,68,52][k]}px">${fa(k)}</div></div>`;
  const rest=ps.slice(3).map((p,i)=>by[p].map(r=>`<div class="r"><i>${fa(i+4)}</i><span>${r[0]}</span><b>${fa(p)}%</b></div>`).join("")).join("");
  $("pub").innerHTML=`<div class="hero">${SYM}${CURVE}<h1>نفرات برتر</h1><p>${e.title} · ${e.sub}</p>`+
   (TOP.length>1?`<div class="chips">${TOP.map((x,i)=>`<button data-i="${i}" class="${i==cur?"on":""}">${x.title}</button>`).join("")}</div>`:"")+
   `<div class="pod">${grp(2)}${grp(1)}${grp(3)}</div></div>`+
   `<div class="stats"><div><b>${fa(e.avg)}%</b><span>میانگین کلاس</span></div><div><b>${fa(e.max)}%</b><span>بالاترین درصد</span></div><div><b>${fa(e.n)}</b><span>شرکت‌کننده</span></div></div>`+
   (rest?`<div class="more"><h3><i>${I("trophy")}</i>نفرات بعدی</h3>${rest}</div>`:"");
  document.querySelectorAll(".chips button").forEach(b=>b.onclick=()=>{cur=+b.dataset.i;pub()});
}
document.querySelectorAll("[data-ic]").forEach(e=>e.innerHTML=I(e.dataset.ic));$("lg").innerHTML=LOGO;$("th").innerHTML=I("contrast");$("ey").innerHTML=I("eye");
let first=1;
function ind(){const b=document.querySelector(".tabs button.on"),i=$("ind");if(!b)return;i.style.transition=first?"none":"";i.style.width=b.offsetWidth-14+"px";i.style.left=b.offsetLeft+7+"px";first=0}
function tab(n){["pub","key","priv"].forEach(x=>$(x).hidden=x!=n);[["tp","pub"],["tk","key"],["tl","priv"]].forEach(([b,x])=>{$(b).classList.toggle("on",x==n);$(b).setAttribute("aria-current",x==n?"page":"false")});ind();try{scrollTo({top:0,behavior:"smooth"})}catch(e){}}
addEventListener("resize",ind);requestAnimationFrame(()=>requestAnimationFrame(ind));if(document.fonts&&document.fonts.ready)document.fonts.ready.then(ind);
$("tp").onclick=()=>tab("pub");$("tk").onclick=()=>tab("key");$("tl").onclick=()=>tab("priv");
const SUD='<svg width="104" height="104" viewBox="0 0 90 90" fill="none" stroke="currentColor"><rect x="1" y="1" width="88" height="88" rx="8" stroke-width="2.4"/><path d="M30 1v88M60 1v88M1 30h88M1 60h88" stroke-width="2"/><path d="M10 1v88M20 1v88M40 1v88M50 1v88M70 1v88M80 1v88M1 10h88M1 20h88M1 40h88M1 50h88M1 70h88M1 80h88" stroke-width=".6" opacity=".55"/></svg>';
function keyView(){$("key").innerHTML=`<div class="card" style="margin-top:0"><h3><i>${I("grid")}</i>پاسخنامه‌ی سودوکو</h3>`+(KEYS.length?KEYS.map(k=>`<a class="kr" href="${k.url}" target="_blank" rel="noopener"><span>${k.title}</span>${I("download")}</a>`).join(""):`<div class="empty">${SUD}<b>هنوز پاسخنامه‌ای قرار داده نشده</b><small>بعد از هر آزمون، پاسخنامه‌ی سودوکوها همین‌جا اضافه می‌شه.</small></div>`)+`</div>`}
pub();keyView();
if(ls.get("th"))document.documentElement.dataset.theme=ls.get("th");
$("th").onclick=()=>{const d=document.documentElement,dk=d.dataset.theme?d.dataset.theme=="dark":matchMedia("(prefers-color-scheme:dark)").matches;d.dataset.theme=dk?"light":"dark";ls.set("th",d.dataset.theme)};
$("ey").onclick=()=>{const h=$("p").type=="password";$("p").type=h?"text":"password";$("ey").innerHTML=I(h?"eyeoff":"eye")};
if(ls.get("pu"))$("u").value=ls.get("pu");
async function open(u,p){
  const e=DATA[u];if(!e)throw 0;
  const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(p),"PBKDF2",false,["deriveKey"]);
  const k=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(e[0]),iterations:100000,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);
  return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(e[1])},k,b64(e[2]))));
}
function show(r){
  const h=new Date().getHours(),g=h<5?"شب بخیر":h<12?"صبح بخیر":h<17?"ظهر بخیر":h<20?"عصر بخیر":"شب بخیر";
  const ex=r.exams||[],avg=ex.length?Math.round(ex.reduce((a,e)=>a+e[1],0)/ex.length*10)/10:null,L=ex[ex.length-1];
  const C=2*Math.PI*42;
  const rk=L?`<span class="chip ${L[2]<4?"late":"full"}">${L[2]<4?medal(L[2]):""} رتبه ${WORD[L[2]]||fa(L[2])} در ${L[0]}</span>`:"";
  const d=L&&L[3]!=null?L[1]-L[3]:null;
  const cmp=d==null?"":`<span class="chip ${d>=0?"full":"partial"}">${d==0?"برابر با میانگین کلاس":fa(Math.abs(d))+"٪ "+(d>0?"بالاتر":"پایین‌تر")+" از میانگین کلاس"}</span>`;
  let trend=`<div class="tr"><small style="color:var(--mut)">${I("trend")} منحنی روند پیشرفت از آزمون دوم به بعد این‌جا نمایش داده می‌شه.</small></div>`;
  if(ex.length>1){const W=300,H=110,X=i=>20+i*(W-40)/(ex.length-1),Y=v=>H-8-v*(H-24)/100,pt=a=>a.map((v,i)=>X(i)+","+Y(v)).join(" "),Pv=ex[ex.length-2],dd=L[1]-Pv[1];
   trend=`<div class="tr"><span class="chip ${dd>=0?"full":"partial"}">${I("trend")} ${dd==0?"بدون تغییر نسبت به آزمون قبل":fa(Math.abs(dd))+"٪ "+(dd>0?"بهتر":"پایین‌تر")+" از آزمون قبل"}</span><svg viewBox="0 0 ${W} ${H}"><path d="M10 ${Y(0)}H${W-10}" stroke="var(--line)"/>`+(ex.every(e=>e[3]!=null)?`<polyline points="${pt(ex.map(e=>e[3]))}" fill="none" stroke="var(--pen)" stroke-width="2" stroke-dasharray="5 4"/>`:"")+`<polyline points="${pt(ex.map(e=>e[1]))}" fill="none" stroke="var(--p)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>`+ex.map((e,i)=>`<circle cx="${X(i)}" cy="${Y(e[1])}" r="4.5" fill="var(--card)" stroke="var(--p)" stroke-width="2.5"/><text x="${X(i)}" y="${Y(e[1])-9}" text-anchor="middle" font-size="10" font-weight="700" fill="var(--ink)">${fa(e[1])}</text>`).join("")+`</svg></div>`}
  const sc=(l,k,t)=>`<div class="card"><div class="st ${k}">${IC[k]}</div><small>${l}</small><b>${t}</b></div>`;
  $("dash").innerHTML=`<div class="card me">${av(r.name)}<div><small>${I(h<5||h>=20?"moon":"sun")} ${g}</small><b>${r.name}</b></div></div>
  <div class="g2">${sc("تکلیف",r.send,SEND[r.send])}${sc("پاسخ‌ها",r.q,Q[r.q])}</div>
  <div class="card"><h3><i>${I("chart")}</i>درصد آزمون‌ها</h3>`+(ex.length?`<div class="res"><div class="ring"><svg width="104" height="104"><circle cx="52" cy="52" r="42" fill="none" stroke="var(--line)" stroke-width="10"/><circle cx="52" cy="52" r="42" fill="none" stroke="var(--p)" stroke-width="10" stroke-linecap="round" stroke-dasharray="${C*avg/100} ${C}"/></svg><b>${fd(avg)}%</b></div><div><small>میانگین درصدهای تو</small><div class="v">${fa(ex.length)} آزمون ثبت‌شده</div>${rk}<br>${cmp}</div></div>
  <div class="bars">${ex.map(e=>`<div class="bc"><b>${fa(e[1])}%</b><div class="bw"><i style="height:${Math.max(e[1],3)*.9}px"></i>${e[3]!=null?`<u style="bottom:${e[3]*.9}px"></u>`:""}</div><span>${e[0]}</span></div>`).join("")}</div>
  <div class="lgd"><u></u>خط زرد = میانگین کلاس</div>${trend}`:`<small style="color:var(--mut)">هنوز درصدی ثبت نشده.</small>`)+`</div>
  <div class="card"><h3><i>${I("cal")}</i>غیبت‌ها</h3><div class="ab"><div class="n">${r.abs==null?"—":fa(r.abs)}</div><small style="color:var(--mut)">${r.abs==null?"هنوز ثبت نشده":r.abs==0?I("star")+" عالی! هیچ غیبتی نداری":"جلسه غیبت"}</small></div></div>`+
  ((r.note||r.detail)?`<div class="card"><h3><i>${I("pencil")}</i>توضیحات</h3><div class="note">${r.detail?`<span class="tag">${r.detail}</span><br>`:""}${r.note}</div></div>`:"")+
  `<div class="card" id="rc" hidden><h3><i>${I("card")}</i>کارنامه</h3><small style="color:var(--mut)">کارنامه‌ی آزمون‌هات رو به‌صورت تصویر ذخیره کن.</small><button class="go" id="sv" style="margin-top:10px">${I("download")} ذخیره‌ی کارنامه</button></div>`+
  `<button class="out" id="out">خروج</button>`;
  $("login").hidden=true;$("dash").hidden=false;
  $("out").onclick=()=>{$("dash").hidden=true;$("login").hidden=false;$("p").value=""};
  initCard(r);
}
function cardSvg(r){
  const ex=r.exams||[],L=ex[ex.length-1],avg=ex.length?Math.round(ex.reduce((a,e)=>a+e[1],0)/ex.length*10)/10:null;
  const T=(x,y,t,sz,c,w)=>`<text x="${x}" y="${y}" text-anchor="middle" direction="rtl" font-family="Vazirmatn,Tahoma,Arial,sans-serif" font-size="${sz}" font-weight="${w||400}" fill="${c}">${t}</text>`;
  const bx=(x,l,v)=>`<rect x="${x-150}" y="0" width="300" height="120" rx="22" fill="#eef6ff"/>`+T(x,44,l,22,"#5d7899")+T(x,92,v,30,"#0e2a4d",700);
  const row=(y,a,b)=>`<g transform="translate(0 ${y})">${bx(180,a[0],a[1])}${bx(540,b[0],b[1])}</g>`;
  return `<svg xmlns="http://www.w3.org/2000/svg" width="720" height="960" viewBox="0 0 720 960"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1b5fc0"/><stop offset="1" stop-color="#4fb0ff"/></linearGradient></defs><rect width="720" height="960" fill="#fff"/><rect width="720" height="250" fill="url(#g)"/>`+
  T(360,66,"استاد محمد امین کریمی",30,"#fff",700)+T(360,108,"کارنامه‌ی آزمون",22,"#d6ebff")+T(360,185,r.name,40,"#fff",700)+
  (L?T(360,370,fa(L[1])+"٪",130,"#2d7be0",700)+T(360,418,L[0],26,"#5d7899")+T(360,468,"رتبه "+fa(L[2])+(L[3]!=null?"  ·  میانگین کلاس "+fa(L[3])+"٪":""),24,"#0e2a4d",700):"")+
  row(520,["وضعیت تکلیف",SEND[r.send]],["وضعیت پاسخ‌ها",Q[r.q]])+row(670,["تعداد غیبت",r.abs==null?"—":fa(r.abs)],["میانگین درصدها",avg==null?"—":fd(avg)+"٪"])+
  T(360,880,"آخرین بروزرسانی: "+UPD,20,"#8aa3c2")+`</svg>`;
}
async function cardPng(r){
  const img=new Image();img.src="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(cardSvg(r));await img.decode();
  const c=document.createElement("canvas");c.width=1080;c.height=1440;c.getContext("2d").drawImage(img,0,0,1080,1440);
  return new Promise((ok,no)=>c.toBlob(b=>b?ok(b):no(),"image/png"));
}
async function initCard(r){
  try{const dl=window.claude&&await claude.use("downloads");if(!dl)return;$("rc").hidden=false;
   $("sv").onclick=async()=>{$("sv").disabled=true;try{await dl.save({filename:"karnameh.png",data:await cardPng(r)})}catch(e){}$("sv").disabled=false}}catch(e){}
}
$("login").onsubmit=async ev=>{
  ev.preventDefault();$("err").style.display="none";$("go").disabled=true;
  const u=fix($("u").value).trim().toLowerCase();
  try{show(await open(u,fix($("p").value).trim()));if($("rm").checked)ls.set("pu",u)}
  catch(x){$("err").textContent="نام کاربری یا رمز عبور اشتباه است.";$("err").style.display="block"}
  $("go").disabled=false;
};
