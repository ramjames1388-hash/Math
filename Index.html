*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;color:var(--ink);font-family:Vazirmatn,Tahoma,sans-serif;line-height:1.8;min-height:100vh;background:linear-gradient(160deg,var(--bg1),var(--bg2));overflow-x:hidden}
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.bl{position:absolute;border-radius:50%;filter:blur(64px);opacity:.55;animation:drift 20s ease-in-out infinite alternate;will-change:transform}
.bl:nth-child(1){width:60vmax;height:60vmax;max-width:520px;max-height:520px;background:var(--b1);top:-14%;right:-18%}
.bl:nth-child(2){width:50vmax;height:50vmax;max-width:440px;max-height:440px;background:var(--b2);bottom:-12%;left:-16%;animation-delay:-7s}
.bl:nth-child(3){width:34vmax;height:34vmax;max-width:300px;max-height:300px;background:var(--b3);top:42%;right:30%;opacity:.35;animation-delay:-12s}
.bg:after{content:"";position:absolute;inset:0;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:30px 30px;-webkit-mask-image:linear-gradient(#000,transparent 70%);mask-image:linear-gradient(#000,transparent 70%)}
@keyframes drift{to{transform:translate(-30px,40px) scale(1.12)}}
.wrap{max-width:520px;margin:0 auto;padding:10px 14px calc(112px + env(safe-area-inset-bottom,0px))}
button{font:inherit;cursor:pointer;position:relative;overflow:hidden;-webkit-appearance:none}
.ico{display:inline-block;width:1.15em;height:1.15em;vertical-align:-.2em;flex:none;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
i.ico svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;display:block}
.gl{background:var(--glass);-webkit-backdrop-filter:blur(14px) saturate(1.5);backdrop-filter:blur(14px) saturate(1.5);border:1px solid var(--gb);box-shadow:var(--sh);border-radius:24px}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.gl{background:var(--solid)}}
.top{display:flex;align-items:center;gap:10px;padding:8px 10px;margin-bottom:12px;position:sticky;top:calc(6px + env(safe-area-inset-top,0px));z-index:15;border-radius:22px}
.top>div:nth-child(2){flex:1;min-width:0}.top small{color:var(--mut);font-size:11.5px;display:block;line-height:1.2}
.top b{font-family:Lalezar,Vazirmatn,sans-serif;font-weight:400;font-size:21px;line-height:1.25}
.lg{width:44px;height:44px;border-radius:14px;overflow:hidden;box-shadow:0 6px 16px rgba(47,107,255,.35)}.lg svg{width:100%;height:100%;display:block}
.ic{width:42px;height:42px;border-radius:14px;border:1px solid var(--gb);background:var(--glass);color:var(--ink);padding:0;display:grid;place-items:center;transition:transform .2s}.ic:active{transform:scale(.9) rotate(20deg)}.ic .ico{width:20px;height:20px}
.hero{border-radius:28px;padding:22px 18px 0;color:#fff;position:relative;overflow:hidden;background:linear-gradient(150deg,#1747c9,#2f6bff 50%,#4fb6ff);box-shadow:0 18px 40px rgba(47,107,255,.32)}
.hero:before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.12) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.12) 1px,transparent 1px);background-size:22px 22px}
.hero:after{content:"";position:absolute;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.35),transparent 70%);top:-90px;left:-60px;animation:glow 8s ease-in-out infinite alternate}
.hero>*{position:relative;z-index:1}.hero svg.cv{position:absolute;left:0;bottom:0;width:100%;height:150px;opacity:.3;pointer-events:none;z-index:0}
.sy{position:absolute;font-family:Lalezar;color:#fff;opacity:.2;font-size:34px;pointer-events:none;animation:fl 6s ease-in-out infinite alternate}
@keyframes fl{to{transform:translateY(-8px) rotate(6deg)}}
.hero h1{font-family:Lalezar,Vazirmatn,sans-serif;font-weight:400;font-size:36px;line-height:1.15;margin:0;text-shadow:0 3px 0 rgba(8,30,90,.25)}
.hero p{margin:0;opacity:.92;font-size:13px}
.chips{display:flex;gap:6px;margin-top:12px;overflow-x:auto;scrollbar-width:none}
.chips button{border:1px solid rgba(255,255,255,.6);background:rgba(255,255,255,.12);color:#fff;border-radius:99px;padding:3px 14px;font-size:12.5px;white-space:nowrap}.chips button.on{background:#fff;color:#1747c9;font-weight:700}
.pod{display:flex;align-items:flex-end;gap:6px;margin-top:24px}.col{flex:1;min-width:0;text-align:center}
.nm{display:flex;flex-direction:column;gap:6px;margin-bottom:8px}
.p{position:relative;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.45);border-radius:16px;padding:8px 4px;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);box-shadow:0 8px 20px rgba(8,30,90,.18)}
.crown{position:absolute;top:-14px;left:50%;transform:translateX(-50%);color:#ffd45c;filter:drop-shadow(0 2px 4px rgba(0,0,0,.25));animation:fl 3s ease-in-out infinite alternate}.crown .ico{width:24px;height:24px;fill:#ffd45c}
.av{width:36px;height:36px;border-radius:50%;margin:0 auto 3px;display:grid;place-items:center;font-weight:800;font-size:15px;color:#fff;border:2px solid var(--g,#fff)}
.p b{display:block;font-size:12.5px;line-height:1.5;overflow-wrap:anywhere}.p small{display:block;font-size:10.5px;opacity:.88;line-height:1.4;min-height:15px}
.p em{font-style:normal;font-weight:800;color:var(--g);font-size:13.5px;direction:ltr;display:block}
.base{position:relative;height:var(--h);display:grid;place-items:center;font-family:Lalezar;font-size:30px;color:#14305a}
.base:before{content:"";position:absolute;inset:0;border-radius:14px 14px 0 0;background:var(--bb);box-shadow:inset 0 2px 0 rgba(255,255,255,.55);transform-origin:bottom;animation:rise .95s cubic-bezier(.22,1,.36,1) backwards;animation-delay:calc(var(--i)*.12s + .35s)}

.nm .p{animation:up .7s cubic-bezier(.22,1,.36,1) backwards;animation-delay:calc(var(--i)*.12s + .75s)}
@keyframes rise{from{transform:scaleY(0)}}@keyframes pop{from{opacity:0;transform:scale(.4)}}
.k1{--g:#ffd45c;--bb:linear-gradient(#ffd45c,#e0a512)}.k2{--g:#e4ecf8;--bb:linear-gradient(#e4ecf8,#a9b9d1)}.k3{--g:#f6b07a;--bb:linear-gradient(#f6b07a,#c46f35)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.sx{padding:12px 6px;text-align:center;border-radius:20px}

.ch{width:34px;height:34px;border-radius:11px;display:inline-grid;place-items:center;background:linear-gradient(135deg,rgba(47,107,255,.16),rgba(56,189,248,.2));color:var(--p);flex:none}.ch .ico{width:18px;height:18px}.sx .ch{margin:0 auto 2px}
.cd{padding:16px;border-radius:24px}.h{display:flex;align-items:center;gap:10px;font-weight:800;font-size:15px;margin-bottom:10px}
.r{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.r i{font-style:normal;width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700}.r span{flex:1}.r b{direction:ltr;color:var(--p)}

label{display:block;font-size:13px;color:var(--mut);margin:0 0 5px}

    AVG.rows.map(r=>{const k=dp.indexOf(r[1])+1;return `<div class="ar rv"><div class="rk ${k<4?"m":""}">${k<4?medal(k):fa(k)}</div><div class="ai"><div class="an"><span>${r[0]}</span><b>${fd(r[1])}%</b></div><div class="bt"><i class="bf" style="width:${r[1]}%"></i></div></div></div>`}).join("")+`</div>`})():"")+`</div>`;

async function open(u,p){
  const e=DATA[u];if(!e)throw 0;
  const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(p),"PBKDF2",false,["deriveKey"]);
  const k=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(e[0]),iterations:100000,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);
  return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(e[1])},k,b64(e[2]))));
}

function show(r){
  const h=new Date().getHours(),night=h<5||h>=20,g=h<5?"شب بخیر":h<12?"صبح بخیر":h<17?"ظهر بخیر":h<20?"عصر بخیر":"شب بخیر";
  const ex=r.exams||[],avg=ex.length?Math.round(ex.reduce((a,e)=>a+e[1],0)/ex.length*10)/10:null,L=ex[ex.length-1],C=264;
  const rk=L?`<span class="chip ${L[2]<4?"late":"full"}">${L[2]<4?medal(L[2]):I("star")} رتبه ${WORD[L[2]]||fa(L[2])} در ${L[0]}</span>`:"";
  const d=L&&L[3]!=null?L[1]-L[3]:null;

  if(ex.length>1){const W=300,H=110,X=i=>20+i*(W-40)/(ex.length-1),Y=v=>H-8-v*(H-24)/100,pt=a=>a.map((v,i)=>X(i)+","+Y(v)).join(" "),Pv=ex[ex.length-2],dd=L[1]-Pv[1];
   trend=`<div class="tr"><span class="chip ${dd>=0?"full":"partial"}">${I("trend")} ${dd==0?"بدون تغییر نسبت به آزمون قبل":fa(Math.abs(dd))+"٪ "+(dd>0?"بهتر":"پایین‌تر")+" از آزمون قبل"}</span><svg viewBox="0 0 ${W} ${H}"><path d="M10 ${Y(0)}H${W-10}" stroke="var(--line)"/>`+(ex.every(e=>e[3]!=null)?`<polyline points="${pt(ex.map(e=>e[3]))}" fill="none" stroke="var(--acc)" stroke-width="2" stroke-dasharray="5 4"/>`:"")+`<polyline class="ln" pathLength="1" points="${pt(ex.map(e=>e[1]))}" fill="none" stroke="var(--p)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>`+ex.map((e,i)=>`<circle cx="${X(i)}" cy="${Y(e[1])}" r="4.5" fill="var(--solid)" stroke="var(--p)" stroke-width="2.5"/><text x="${X(i)}" y="${Y(e[1])-9}" text-anchor="middle" font-size="10" font-weight="700" fill="var(--ink)">${fa(e[1])}</text>`).join("")+`</svg></div>`}
  const tile=(l,k,t,m)=>`<div class="gl tile">${MI(m)}<small>${l}</small><b class="pill ${k}">${IC[k]}<span>${t}</span></b></div>`;
  $("dash").innerHTML=`<div class="st-in">
  <div class="prof" style="--i:0"><div class="avr">${av(r.name)}</div><div><small>${I(night?"moon":"sun")} ${g}</small><b>${r.name}</b></div></div>
  <div class="g2" style="--i:1">${tile("وضعیت تکلیف",r.send,SEND[r.send],"tri")}${tile("وضعیت پاسخ‌ها",r.q,Q[r.q],"circ")}</div>
  <div class="gl cd" style="--i:2"><div class="h"><div class="ch">${MI("fn")}</div>درصد آزمون‌ها</div>`+(ex.length?`<div class="res"><div class="ring"><svg width="108" height="108" viewBox="0 0 108 108"><defs><linearGradient id="rg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--p2)"/><stop offset="1" style="stop-color:var(--p)"/></linearGradient></defs><circle cx="54" cy="54" r="42" fill="none" stroke="var(--line)" stroke-width="10"/><circle class="pg" cx="54" cy="54" r="42" fill="none" stroke="url(#rg)" stroke-width="10" stroke-linecap="round" stroke-dasharray="${C*avg/100} ${C}"/></svg><b data-n="${avg}" data-s="%">${fd(avg)}%</b></div><div class="rt"><small>میانگین درصدهای تو</small><div class="v">${fa(ex.length)} آزمون ثبت‌شده</div>${rk}${cmp}</div></div>
  <div class="bars">${ex.map((e,k)=>`<div class="bc"><b>${fa(e[1])}%</b><div class="bw"><i style="--k:${k};height:${Math.max(e[1],3)*.9}px"></i>${e[3]!=null?`<u style="bottom:${e[3]*.9}px"></u>`:""}</div><span>${e[0]}</span></div>`).join("")}</div>
  <div class="lgd"><u></u>خط زرد = میانگین کلاس</div>${trend}`:`<small style="color:var(--mut)">هنوز درصدی ثبت نشده.</small>`)+`</div>
  <div class="gl cd ab" style="--i:3"><div><div class="h"><div class="ch">${MI("empty")}</div>غیبت‌ها</div><small>${r.abs==null?"هنوز ثبت نشده":r.abs==0?I("star")+" عالی! هیچ غیبتی نداری":"جلسه غیبت"}</small></div><div class="n" ${r.abs==null?"":`data-n="${r.abs}"`}>${r.abs==null?"—":fa(r.abs)}</div></div>`+
  ((r.note||r.detail)?`<div class="gl cd" style="--i:4"><div class="h"><div class="ch">${MI("ruler")}</div>توضیحات</div><div class="note">${r.detail?`<span class="tag">${r.detail}</span><br>`:""}${r.note}</div></div>`:"")+

  <button class="out rip" id="out" style="--i:6">${I("log-out")}<span>خروج</span></button></div>`;

function cardSvg(r){
  const ex=r.exams||[],L=ex[ex.length-1],avg=ex.length?Math.round(ex.reduce((a,e)=>a+e[1],0)/ex.length*10)/10:null;
  const T=(x,y,t,sz,c,w)=>`<text x="${x}" y="${y}" text-anchor="middle" direction="rtl" font-family="Vazirmatn,Tahoma,Arial,sans-serif" font-size="${sz}" font-weight="${w||400}" fill="${c}">${t}</text>`;
  const bx=(x,l,v)=>`<rect x="${x-150}" y="0" width="300" height="120" rx="22" fill="#eef6ff"/>`+T(x,44,l,22,"#5d7899")+T(x,92,v,30,"#0e2a4d",700);
  const row=(y,a,b)=>`<g transform="translate(0 ${y})">${bx(180,a[0],a[1])}${bx(540,b[0],b[1])}</g>`;
  return `<svg xmlns="http://www.w3.org/2000/svg" width="720" height="960" viewBox="0 0 720 960"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1b5fc0"/><stop offset="1" stop-color="#4fb0ff"/></linearGradient></defs><rect width="720" height="960" fill="#fff"/><rect width="720" height="250" fill="url(#g)"/>`+
  T(360,66,"استاد محمد امین کریمی",30,"#fff",700)+T(360,108,"کارنامه‌ی آزمون",22,"#d6ebff")+T(360,185,r.name,40,"#fff",700)+
  (L?T(360,370,fa(L[1])+"٪",130,"#2d7be0",700)+T(360,418,L[0],26,"#5d7899")+T(360,468,"رتبه "+fa(L[2])+(L[3]!=null?"  ·  میانگین کلاس "+fa(L[3])+"٪":""),24,"#0e2a4d",700):"")+
  row(520,["وضعیت تکلیف",SEND[r.send]],["وضعیت پاسخ‌ها",Q[r.q]])+row(670,["تعداد غیبت",r.abs==null?"—":fa(r.abs)],["میانگین درصدها",avg==null?"—":fd(avg)+"٪"])+
  T(360,880,"آخرین بروزرسانی: "+UPD,20,"#8aa3c2")+`</svg>`;
}
async function cardPng(r){
  const img=new Image();img.src="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(cardSvg(r));await img.decode();
  const c=document.createElement("canvas");c.width=1080;c.height=1440;c.getContext("2d").drawImage(img,0,0,1080,1440);
  return new Promise((ok,no)=>c.toBlob(b=>b?ok(b):no(),"image/png"));
}
async function initCard(r){

   $("sv").onclick=async()=>{$("sv").disabled=true;try{await dl.save({filename:"karnameh.png",data:await cardPng(r)})}catch(e){}$("sv").disabled=false}}catch(e){}
}

  if(rec){show(rec);if($("rm").checked)ls.set("pu",u)}else $("err").classList.add("on");ric();
};
{const sp=$("splash");try{if(RM||sessionStorage.getItem("sp"))sp.remove();else{sessionStorage.setItem("sp","1");sp.onclick=()=>sp.remove();setTimeout(()=>sp.remove(),2700)}}catch(e){sp.remove()}}
